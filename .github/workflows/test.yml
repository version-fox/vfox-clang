name: Test Plugin

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          cache: false
      # The vfox release is pinned and its checksum checked, as the actions are
      # pinned by their commits; change the two together to move to another release.
      - name: Install vfox
        env:
          VFOX_VERSION: 1.1.0
          VFOX_SHA256: 3b33c3c468b27bc17aecf0d6d3af24fe49fe204972984904a136a47b402a0ee4
        run: |
          archive="$RUNNER_TEMP/vfox.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --output "$archive" \
            "https://github.com/version-fox/vfox/releases/download/v${VFOX_VERSION}/vfox_${VFOX_VERSION}_linux_x86_64.tar.gz"
          echo "$VFOX_SHA256  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/vfox"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/vfox" --strip-components=1 \
            "vfox_${VFOX_VERSION}_linux_x86_64/vfox"
          echo "$RUNNER_TEMP/vfox" >> "$GITHUB_PATH"
      # vfox plugin test runs tests/**/*_test.lua offline, each in a VM of its own.
      # It disables os.execute and io.popen, so the tests stub what they need.
      - name: Run the offline hook tests with vfox
        run: vfox plugin test .
      # vfox plugin test disables os.execute, so the shell quoting runs under glua,
      # the interpreter of vfox's Lua runtime, against the real /bin/sh.
      - name: Test the shell quoting with the real shell
        run: go run github.com/yuin/gopher-lua/cmd/glua@v1.1.1 tests/shell_quoting.lua
