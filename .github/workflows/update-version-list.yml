name: Check Updates Periodically

on:
  schedule:
    - cron: "0 16 * * 1,4"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  update-version-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The tool is built from its source on every run, so the repository keeps
      # no binary. Crystal's standard library is all it needs.
      - name: Install Crystal
        uses: crystal-lang/install-crystal@47f17b5ecff0cc09e96fa95f5220311329bf4bc8 # v1.10.0
        with:
          crystal: 1.22.3

      - name: Build the version list tool
        run: crystal build --release --no-debug .github/UpdateVersionList.cr -o "$RUNNER_TEMP/UpdateVersionList"

      - name: Check updates
        id: check_updates
        run: |
          "$RUNNER_TEMP/UpdateVersionList" -o manifest.md
          if [ -s manifest.md ]; then
            HAS_UPDATES=true
            echo "Updates found"
          else
            HAS_UPDATES=false
            echo "Already up to date"
          fi
          echo "HAS_UPDATES=$HAS_UPDATES" >> "$GITHUB_OUTPUT"

      - name: Update manifest body
        if: ${{ steps.check_updates.outputs.HAS_UPDATES == 'true' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          name: "manifest"
          tag: "manifest"
          allowUpdates: true
          bodyFile: "manifest.md"
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
