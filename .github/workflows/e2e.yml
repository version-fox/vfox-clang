name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces the run of the push before it. Every
  # commit on main gets a group of its own, so no run cancels another's result.
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-linux:
    name: Ubuntu container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Run the suite in Ubuntu 26.04 containers
        run: go test -v -timeout 55m -run TestE2E ./linux
        working-directory: tests/e2e

  e2e-windows:
    name: Windows runner
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Run the suite on the Windows runner
        run: go test -v -timeout 55m -run TestE2E ./windows
        working-directory: tests/e2e
